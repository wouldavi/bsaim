<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS Aim</title>
    <link rel="icon" type="image/x-icon" href="bsaim.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: #111111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 4rem;
            font-weight: 700;
            color: #FFFF00;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .desc {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #fff;
        }

        .desc span {
            color: #FFFF00;
            font-weight: 600;
        }

        .list {
            list-style: none;
            text-align: left;
            margin: 30px 0 35px;
            padding: 0;
            color: #fff;
        }

        .list li {
            padding-left: 22px;
            margin-bottom: 10px;
            position: relative;
            line-height: 1.5;
        }

        .list li::before {
            content: "▸";
            color: #FFFF00;
            position: absolute;
            left: 0;
            top: 0;
        }

        .list li strong {
            color: #FFFF00;
            font-weight: 600;
        }

        .list li .sub {
            display: block;
            font-size: 0.95rem;
            color: #ddd;
            margin-top: 2px;
            padding-left: 4px;
        }

        .btn {
            display: inline-block;
            background: #5865F2;
            color: #fff;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 14px 40px;
            border-radius: 8px;
            text-decoration: none;
            border: 0;
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.35);
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            background: #4752C4;
            box-shadow: 0 6px 16px rgba(88, 101, 242, 0.5);
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.8rem;
            }

            .desc {
                font-size: 1rem;
            }

            .list li {
                font-size: 0.95rem;
            }

            .btn {
                font-size: 1rem;
                padding: 12px 30px;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">BS Aim</h1>

        <p class="desc">
            Maximize seu desempenho nas partidas com o <span>melhor</span>!
        </p>

        <ul class="list">
            <li><strong>Atalhos rápidos</strong> no teclado</li>
            <li><strong>Executáveis assinados</strong></li>
            <li><strong>100% Indetectável</strong> pelo Anti-Cheat</li>
            <li>
                <strong>Menu invisível</strong> em:
                <span class="sub">Alt + Tab, Barra de tarefas, Capturas de tela, Gravações, Gerenciador de tarefas e Transmissões.</span>
            </li>
        </ul>

        <a href="https://discord.gg/ud8GgdauAz" target="_blank" rel="noopener noreferrer" class="btn">
            Discord
        </a>
    </div>
</body>
</html>
